<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Folio Show (shared with the suite): display common document fonts with free equivalents.
     Calibri/Cambria are already handled by the crosextra packages. -->
<fontconfig>
  <alias binding="same"><family>Calibri Light</family><accept><family>Carlito</family></accept></alias>
  <alias binding="same"><family>Aptos</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Aptos Display</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Aptos Narrow</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Segoe UI</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Candara</family><prefer><family>Carlito</family></prefer></alias>
  <alias binding="same"><family>Constantia</family><prefer><family>Caladea</family></prefer></alias>
  <alias binding="same"><family>Georgia</family><prefer><family>Gelasio</family><family>Caladea</family></prefer></alias>
  <alias binding="same"><family>Times New Roman</family><accept><family>Liberation Serif</family></accept></alias>
  <alias binding="same"><family>Arial</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Courier New</family><accept><family>Liberation Mono</family></accept></alias>
  <alias binding="same"><family>Arial Narrow</family><accept><family>Liberation Sans Narrow</family></accept></alias>
</fontconfig>
